<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Inter,Segoe UI,Arial,sans-serif">
  <rect width="1200" height="420" rx="18" fill="#0f172a"/>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
  <text x="40" y="52" fill="#f8fafc" font-size="24" font-weight="700">RevidAPI Trading Agents</text>
