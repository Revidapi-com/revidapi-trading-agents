    <rect x="320" y="175" width="170" height="60" rx="10" fill="#14532d"/><text x="345" y="211" fill="#bbf7d0">Phe tăng giá</text>
    <rect x="320" y="255" width="170" height="60" rx="10" fill="#7f1d1d"/><text x="345" y="291" fill="#fecaca">Phe giảm giá</text>
    <rect x="560" y="160" width="180" height="170" rx="14" fill="#1e293b" stroke="#a855f7"/>
