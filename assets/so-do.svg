  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#m)">
    <line x1="252" y1="245" x2="296" y2="245"/><line x1="512" y1="245" x2="556" y2="245"/>
    <line x1="742" y1="245" x2="786" y2="245"/><line x1="972" y1="245" x2="1016" y2="245"/>
  </g>
  <text x="40" y="402" fill="#64748b" font-size="12">Dựa trên mã nguồn mở TradingAgents (Apache-2.0). Chỉ để nghiên cứu, không phải lời khuyên đầu tư.</text>
